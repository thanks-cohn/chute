<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chute Shelf</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">↓</div>
      <div><div class="title">Chute Shelf</div><div class="subtitle">Your bottomless local history.</div></div>
    </div>
    <div class="actions">
      <button id="refresh" class="icon-button" title="Refresh">↻</button>
      <button id="clear" class="secondary-button">Clear live chute</button>
    </div>
  </header>

  <div class="history-nav">
    <button id="history-prev" class="icon-button" type="button" title="Older day">‹</button>
    <input id="history-date" type="date" aria-label="Selected history date" hidden>
    <button id="history-calendar-toggle" class="secondary-button history-calendar-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="history-calendar-popover">
      <span aria-hidden="true">▦</span><span id="history-calendar-label">Calendar</span>
    </button>
    <div id="history-calendar-popover" class="history-calendar-popover" role="dialog" aria-label="Choose a Chute history date" hidden>
      <div class="history-calendar-heading">
        <button id="history-calendar-month-prev" class="icon-button" type="button" aria-label="Previous month">‹</button>
        <strong id="history-calendar-month-label"></strong>
        <button id="history-calendar-month-next" class="icon-button" type="button" aria-label="Next month">›</button>
      </div>
      <div id="history-calendar-grid" class="history-calendar-grid" aria-label="History days colored by saves"></div>
      <div class="history-calendar-legend" aria-label="Daily save color scale">
        <span><i class="calendar-maroon"></i>0–9</span>
        <span><i class="calendar-orange"></i>10–19</span>
        <span><i class="calendar-light-green"></i>20–49</span>
        <span><i class="calendar-money"></i>50+</span>
      </div>
      <p class="history-calendar-hint">Select any day to browse its preserved history. Clearing Live Chute never changes these totals.</p>
    </div>
    <button id="history-latest" class="secondary-button" type="button">Latest</button>
    <button id="history-next" class="icon-button" type="button" title="Newer day">›</button>
  </div>

  <div id="status" class="status">Connecting…</div>
  <main id="files" class="file-list"></main>
  <div id="history-sentinel" class="history-sentinel" aria-hidden="true"></div>
  <footer class="footer">Clearing the live Chute never deletes history. Browse any recorded day and Recall preserved items whenever you need them.</footer>
  <script src="shelf.js"></script>
  <script src="companion-help.js"></script>
  <script src="workflow-fixes.js"></script>
  <script src="drag-relay.js"></script>
  <script src="calendar.js"></script>
</body>
</html>

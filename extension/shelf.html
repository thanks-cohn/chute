<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chute Shelf</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">↓</div>
      <div><div class="title">Chute Shelf</div><div class="subtitle">Pick up. Drop anywhere.</div></div>
    </div>
    <div class="actions">
      <button id="refresh" class="icon-button" title="Refresh">↻</button>
      <button id="clear" class="secondary-button">Clear</button>
    </div>
  </header>
  <div id="status" class="status">Connecting…</div>
  <main id="files" class="file-list"></main>
  <footer class="footer">For large files, click once to prepare them before dragging.</footer>
  <script src="shelf.js"></script>
</body>
</html>

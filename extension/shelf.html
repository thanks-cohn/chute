<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chutey</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="workspace-tabs.css">
  <link rel="stylesheet" href="explorer-shell.css">
  <link rel="stylesheet" href="explorer-view.css">
  <link rel="stylesheet" href="shelf-gallery-preview.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo"><img src="icons/icon32.png" alt="" width="27" height="27"></div>
      <div><div class="title">Chutey</div><div class="subtitle">Your Everything</div></div>
    </div>
    <div class="actions">
      <button id="refresh" class="icon-button" title="Refresh">↻</button>
      <button id="clear" class="icon-button chute-clear-button" type="button" title="Clear Live Chutey" aria-label="Clear Live Chutey"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 4h4M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></svg></button>
    </div>
  </header>

  <nav id="chutey-workspace-tabs" class="chutey-workspace-tabs" role="tablist" aria-label="Chutey workspace">
    <button id="chutey-tab-history" class="chutey-tab is-active" type="button" role="tab" aria-controls="chutey-history-view" aria-selected="true" tabindex="0">History</button>
    <button id="chutey-tab-explorer" class="chutey-tab" type="button" role="tab" aria-controls="chutey-explorer-view" aria-selected="false" tabindex="-1">File Explorer</button>
  </nav>
  <section id="chutey-history-view" role="tabpanel" aria-labelledby="chutey-tab-history">
  <div class="history-nav">
    <button id="history-prev" class="icon-button" type="button" title="Older day">‹</button>
    <input id="history-date" type="date" aria-label="Selected history date" hidden>
    <button id="history-calendar-toggle" class="secondary-button history-calendar-toggle" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="history-calendar-popover">
      <span aria-hidden="true">▦</span><span id="history-calendar-label">Calendar</span>
    </button>
    <div id="history-calendar-popover" class="history-calendar-popover" role="dialog" aria-label="Choose a Chute history date" hidden>
      <div class="history-calendar-heading">
        <button id="history-calendar-month-prev" class="icon-button" type="button" aria-label="Previous month">‹</button>
        <strong id="history-calendar-month-label"></strong>
        <button id="history-calendar-month-next" class="icon-button" type="button" aria-label="Next month">›</button>
      </div>
      <div id="history-calendar-grid" class="history-calendar-grid" aria-label="History days colored by saves"></div>
      <div class="history-calendar-legend" aria-label="Daily save color scale">
        <span><i class="calendar-maroon"></i>0–9</span>
        <span><i class="calendar-orange"></i>10–19</span>
        <span><i class="calendar-light-green"></i>20–49</span>
        <span><i class="calendar-money"></i>50+</span>
      </div>
      <p class="history-calendar-hint">Select any day to browse its preserved history. Clearing Live Chute never changes these totals.</p>
    </div>
    <button id="history-latest" class="secondary-button" type="button">Latest</button>
    <button id="history-next" class="icon-button" type="button" title="Newer day">›</button>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" hidden>Connecting…</div>
  <main id="files" class="file-list"></main>
  <nav id="history-pagination" class="history-pagination" aria-label="Browse file pages" hidden>
    <button id="history-page-prev" class="secondary-button" type="button">‹ Previous</button>
    <span id="history-page-label" class="page-position" aria-live="polite">Page 1</span>
    <button id="history-page-next" class="secondary-button" type="button">Next ›</button>
  </nav>
  <div id="history-sentinel" class="history-sentinel" aria-hidden="true"></div>
  <footer class="footer">Clearing the live Chute never deletes history. Browse any recorded day and Recall preserved items whenever you need them.</footer>
  </section>
  <section id="chutey-explorer-view" class="chutey-explorer-shell" role="tabpanel" aria-labelledby="chutey-tab-explorer" hidden>
  </section>
  <script src="native-wake-page.js"></script>
  <script src="bridge-reconnect.js"></script>
  <script src="shelf.js"></script>
  <script src="companion-help.js"></script>
  <script src="workflow-fixes.js"></script>
  <script src="drag-relay.js"></script>
  <script src="calendar.js"></script>
  <script src="workspace-tabs.js"></script>
  <script src="explorer-api.js"></script>
  <script src="explorer-view.js"></script>
  <script src="shelf-gallery-preview.js"></script>
</body>
</html>

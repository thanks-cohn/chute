<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chute</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { width: 390px; max-height: 600px; overflow: auto; }
    .popup-note { padding: 0 13px 11px; color: #8f9882; font-size: 10px; }
    .settings {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px 12px;
      align-items: center;
      padding: 10px 13px;
      border-top: 1px solid #262a22;
      color: #afb7a2;
      font-size: 11px;
    }
    .settings label { display: contents; }
    .settings select,
    .settings input[type="url"] {
      min-width: 103px;
      padding: 5px 7px;
      border: 1px solid #3a4032;
      border-radius: 7px;
      color: #eff2e8;
      background: #252a20;
      font: inherit;
    }
    .settings input[type="url"] { width: 190px; }
    .toggle { width: 17px; height: 17px; accent-color: #d7ff3f; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">↓</div>
      <div><div class="title">Chute</div><div class="subtitle">Your terminal and browser files</div></div>
    </div>
    <div class="actions">
      <button id="open-shelf" class="primary-button">Open shelf</button>
    </div>
  </header>
  <div id="status" class="status">Connecting…</div>
  <main id="files" class="file-list"></main>
  <section class="settings" aria-label="Chute settings">
    <label>
      <span>Files shown</span>
      <select id="display-limit">
        <option value="20">Latest 20</option>
        <option value="50">Latest 50</option>
        <option value="0">Unlimited</option>
      </select>
    </label>
    <label>
      <span>Sticky bin on webpages</span>
      <input id="bin-visible" class="toggle" type="checkbox" checked>
    </label>
    <label>
      <span>Sticky layer</span>
      <select id="bin-layer">
        <option value="front">Always on top</option>
        <option value="back">Behind page</option>
      </select>
    </label>
    <label>
      <span>Love Chute link</span>
      <input id="love-url" type="url" inputmode="url" placeholder="https://patreon.com/your-page" aria-label="Love Chute support URL">
    </label>
  </section>
  <div class="popup-note">Drag from Chute, or drop files and links into the sticky bin. Right-click the sticky Chute to send it behind the page or restore it on top.</div>
  <script src="shelf.js"></script>
  <script src="popup.js"></script>
</body>
</html>

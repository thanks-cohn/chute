<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chute Bin</title>
  <link rel="stylesheet" href="bin.css">
</head>
<body>
  <main class="chute-shell">
    <button id="bin" class="bin" type="button" aria-label="Drop files into Chute" title="Drop files here to send them to Chute">
      <span class="tape" aria-hidden="true"></span>
      <span class="paper">
        <span id="face" class="face" aria-hidden="true">•ᴗ•</span>
        <span id="label" class="label">CHUTE</span>
        <span id="count" class="count" hidden></span>
      </span>
      <span class="mouth" aria-hidden="true"></span>
    </button>
    <button id="love-chute" class="love-chute" type="button" title="Support Chute">❤️ Love Chute</button>
    <div id="context-menu" class="context-menu" role="menu" hidden>
      <button id="layer-toggle" class="context-item" type="button" role="menuitem">Send Chute to back</button>
    </div>
  </main>
  <script src="bin.js"></script>
</body>
</html>

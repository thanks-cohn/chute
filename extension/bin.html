<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chute Bin</title>
  <link rel="stylesheet" href="bin.css">
</head>
<body>
  <button id="bin" class="bin" type="button" aria-label="Drop files into Chute" title="Drop files here to send them to Chute">
    <span class="tape" aria-hidden="true"></span>
    <span class="paper">
      <span id="face" class="face" aria-hidden="true">•ᴗ•</span>
      <span id="label" class="label">CHUTE</span>
      <span id="count" class="count" hidden></span>
    </span>
    <span class="mouth" aria-hidden="true"></span>
  </button>

  <div id="support-card" class="support-card" aria-hidden="true">
    <span class="support-copy">Little Chute saved you a click?</span>
    <a href="https://buy.stripe.com/7sI9CD0uQ96mdY43cc" target="_blank" rel="noopener noreferrer">☕ Buy the Creator a Coffee</a>
  </div>

  <script src="bin.js"></script>
</body>
</html>

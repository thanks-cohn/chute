[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chute-cli"
version = "0.2.0"
description = "A persistent browser file bin backed by a local CLI queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chute contributors" }]
keywords = ["cli", "chrome-extension", "drag-and-drop", "localhost"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
chute = "chute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chute-cli"
version = "2.0.0"
description = "A persistent browser file chute with recallable local history."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chute contributors" }]
keywords = ["cli", "chrome-extension", "drag-and-drop", "localhost", "history"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
]

[project.scripts]
chute = "chute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

name: Chutey Development 1 matching Windows worker (isolated review)
on:
  push:
    branches:
      - build/chutey-phase1-worker-2026-11-16
    paths:
      - .github/workflows/build-chutey-phase1-worker-2026-11-16.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-matched-worker:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out pinned development source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source is Development 1 with only this workflow added
        shell: pwsh
        run: |
          $expected='62694d6f821481c7857d134a8ddd1ba6e6aded83'
          $base=(git rev-parse HEAD^).Trim()
          if ($base -ne $expected) { throw "Base source changed: $base" }
          $changes=@(git diff --name-only HEAD^ HEAD)
          if ($changes.Count -ne 1 -or $changes[0] -ne '.github/workflows/build-chutey-phase1-worker-2026-11-16.yml') {
            throw "Unexpected source changes: $($changes -join ', ')"
          }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Development 1 regression tests
        shell: pwsh
        run: |
          python -m pip install -e . pytest Pillow==13.0.0
          if ($LASTEXITCODE -ne 0) { throw 'dependencies failed' }
          python -m pytest -q tests/test_native_host.py tests/test_browser_extensions.py tests/test_explorer_native.py tests/test_runtime_efficiency.py
          if ($LASTEXITCODE -ne 0) { throw 'python regressions failed' }
          node scripts/verify-worker-boot.cjs
          if ($LASTEXITCODE -ne 0) { throw 'worker boot failed' }
          node scripts/verify-runtime-efficiency.cjs
          if ($LASTEXITCODE -ne 0) { throw 'runtime efficiency failed' }
          node scripts/verify-chutey-tabs-and-mascot.cjs
          if ($LASTEXITCODE -ne 0) { throw 'mascot tests failed' }
      - name: Build matching Windows EXE and native helper
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          if (-not (Test-Path 'dist/windows/Chute-Windows.exe')) { throw 'Companion missing' }
          if (-not (Test-Path 'dist/windows/Chute-NativeHost.exe')) { throw 'Native helper missing' }
      - name: Package matching Chrome extension
        shell: pwsh
        run: |
          python scripts/build-chrome-store.py
          if ($LASTEXITCODE -ne 0) { throw 'Chrome package failed' }
      - name: Stage binaries, source identity and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out='dist/phase1-review'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'dist/windows/Chute-Windows.exe' "$out/Chute-Windows-Dev1-TEST.exe"
          Copy-Item 'dist/windows/Chute-NativeHost.exe' "$out/Chute-NativeHost-Dev1-TEST.exe"
          $chrome=Get-ChildItem 'dist/chrome-store' -Filter 'chute-chrome-*.zip' -File | Select-Object -First 1
          if (-not $chrome) { throw 'Matching Chrome zip missing' }
          Copy-Item $chrome.FullName "$out/$($chrome.Name)"
          '62694d6f821481c7857d134a8ddd1ba6e6aded83' | Set-Content "$out/SOURCE-COMMIT.txt"
          (git rev-parse HEAD).Trim() | Set-Content "$out/BUILD-COMMIT.txt"
          @'
          CHUTEY DEVELOPMENT 1 — WINDOWS TEST CANDIDATE
          Source: 62694d6f821481c7857d134a8ddd1ba6e6aded83
          Build branch: build/chutey-phase1-worker-2026-11-16
          This is a test candidate, not an approved replacement.
          Preserve and verify the archived old worker before replacing anything.
          Chute-Windows-Dev1-TEST.exe is a self-installer: it installs to the real per-user Chute location.
          Do NOT run it until the existing Chute process is stopped and you are ready to replace the installed worker.
          Do NOT delete any Chute data, history or Chrome profiles.
          The separate Chute-NativeHost-Dev1-TEST.exe is included for identity/hash review; the companion bundles the native host.
          Use the matching Chrome extension ZIP or the pinned source extension for testing.
          Development 2 remains on hold until owner approval.
          '@ | Set-Content "$out/README-FIRST.txt"
          $files=Get-ChildItem $out -File | Sort-Object Name
          @($files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }) | Set-Content "$out/SHA256SUMS.txt"
          foreach ($file in $files) { Write-Output "$($file.Name): $((Get-FileHash $file.FullName -Algorithm SHA256).Hash)" }
      - name: Upload matching pair as a review artifact — no releases overwritten
        uses: actions/upload-artifact@v4
        with:
          name: Chutey-Development1-Windows-TEST-${{ github.sha }}
          if-no-files-found: error
          path: dist/phase1-review/*

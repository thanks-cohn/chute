name: Validate Chute v2.6 Store package

on:
  workflow_dispatch:
  push:
    branches:
      - fix/store-v2.5-reconnect
    paths:
      - extension/**
      - scripts/build-chrome-store.py
      - .github/workflows/store-v2.6-validation.yml

permissions:
  contents: read

jobs:
  validate-store-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chute
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find extension -type f -name '*.js' -print0)

      - name: Validate Python syntax
        shell: bash
        run: python -m compileall -q src scripts

      - name: Build Chrome Web Store ZIP
        shell: bash
        run: python scripts/build-chrome-store.py

      - name: Confirm v2.6 package
        shell: bash
        run: |
          test -f dist/chrome-store/chute-chrome-2.6.0.zip
          python - <<'PY'
          import json, zipfile
          path = 'dist/chrome-store/chute-chrome-2.6.0.zip'
          with zipfile.ZipFile(path) as z:
              manifest = json.loads(z.read('manifest.json'))
              assert manifest['manifest_version'] == 3
              assert manifest['version'] == '2.6.0'
              assert 'nativeMessaging' in manifest['permissions']
          print('PASS: Store ZIP is MV3 v2.6.0 with nativeMessaging declared')
          PY

      - name: Upload Store package for testing
        uses: actions/upload-artifact@v4
        with:
          name: chute-chrome-2.6.0-test
          path: dist/chrome-store/chute-chrome-2.6.0.zip

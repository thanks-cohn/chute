name: Chutey Chrome header and compact Shelf
on:
  push:
    branches: [fix/chutey-chrome-sidepanel-name-2026-11-04, fix/chutey-calendar-row-alignment-2026-11-04]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  visual-and-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Chutey manifest title and installed companion contracts
        run: python scripts/verify-upgrades-package.py
      - name: Test History cards, Chrome JS and tab behavior
        run: |
          find extension -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/verify-chutey-tabs-and-mascot.cjs
          node scripts/verify-thumbnail-icons.cjs
          node scripts/verify-worker-boot.cjs
      - name: Run old and new Chrome discovery tests
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_browser_extensions.py tests/test_native_host.py
      - name: Build Chrome extension package and inspect display name
        run: |
          python scripts/build-chrome-store.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/chrome-store/chute-extension-2.6.1/manifest.json').read_text())
          assert manifest['name'] == manifest['short_name'] == 'Chutey'
          assert manifest['action']['default_title'] == 'Chutey'
          print('PASS: Chrome side panel header will display Chutey')
          PY

name: Chute main-based upgrades — cross-platform regression
on:
  workflow_dispatch:
  push:
    branches:
      - chute-main-2.6.1-upgrades-2026-11-03

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full Python regression suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify extension JavaScript syntax and boot contract
        shell: bash
        run: |
          find extension -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          python scripts/verify-upgrades-package.py
          node scripts/verify-worker-boot.cjs

name: Build Chrome Web Store package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - extension/**
      - scripts/build-chrome-store.py
      - .github/workflows/chrome-store-package.yml
  push:
    branches:
      - main
    paths:
      - extension/**
      - scripts/build-chrome-store.py
      - .github/workflows/chrome-store-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Chute
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax-check extension JavaScript
        run: |
          find extension -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Chrome Web Store package
        run: python scripts/build-chrome-store.py

      - name: Inspect packaged manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = "2.6.0"
          package = Path(f"dist/chrome-store/chute-extension-{version}")
          manifest = json.loads((package / "manifest.json").read_text())
          assert manifest["manifest_version"] == 3
          assert manifest["version"] == version
          assert len(manifest["description"]) <= 132
          assert "nativeMessaging" in manifest.get("permissions", [])
          assert "activeTab" not in manifest.get("permissions", [])
          assert "scripting" not in manifest.get("permissions", [])
          assert Path(f"dist/chrome-store/chute-chrome-{version}.zip").is_file()
          for size in ("16", "32", "48", "128"):
              assert (package / manifest["icons"][size]).is_file()
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: Chute-Chrome-Web-Store-v2.6.0
          path: |
            dist/chrome-store/chute-chrome-2.6.0.zip
            dist/chrome-store/store-assets/store-icon-128.png
            dist/chrome-store/store-assets/small-promo-440x280.png
            dist/chrome-store/store-assets/marquee-1400x560.png
            CHROME_WEB_STORE_SUBMISSION.md
            PRIVACY.md

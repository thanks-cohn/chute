name: Development 1 Request 3 isolated Windows test pair
on:
  workflow_dispatch:
  push:
    branches: [codex/2026-11-16-phase1-repairs]
    paths: ['src/**', 'extension/**', 'scripts/**', 'tests/**', 'pyproject.toml', '.github/workflows/development1-request3-pair.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src
      PYTHONIOENCODING: utf-8
      CHUTE_QUIET: '1'
      CHUTE_MEDIA_EVIDENCE: dist/request3-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.2.0 Pillow==13.0.0 playwright==1.65.2
      - name: Windows Python regression tests
        run: python -m pytest -q --junitxml=request3-windows-tests.xml
      - name: JavaScript and packaging contracts
        run: |
          node scripts/verify-worker-boot.cjs
          node scripts/verify-thumbnail-icons.cjs
          node scripts/verify-chutey-tabs-and-mascot.cjs
          node scripts/verify-explorer-api.cjs
          node scripts/verify-explorer-drag.cjs
          node scripts/verify-popup-gallery.cjs
          node scripts/verify-media-diagnostics.cjs
          python scripts/verify-upgrades-package.py
          python scripts/verify-popup-settings-boundary.py
      - name: FFmpeg fixture generator
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg fixture tool install failed' }
          }
      - name: Real Chrome media in both viewers with guarded Windows files
        run: python scripts/verify-request3b-media.py
      - name: Build fresh setup and helper without installation
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          ./scripts/build-phase1-isolated-check.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Isolated checker build failed' }
          python scripts/build-chrome-store.py
          if ($LASTEXITCODE -ne 0) { throw 'Extension packaging failed' }
      - name: Exercise packaged checker and native helper without registration
        shell: pwsh
        run: |
          & ./dist/phase1-isolated/Chutey-Phase1-Isolated-Check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packaged checker failed' }
          python scripts/verify-packaged-explorer-host.py dist/windows/Chute-NativeHost.exe dist/windows/Chute-NativeHost.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native framed protocol failed' }
      - name: Stage matching owner test package and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist/request3-pair | Out-Null
          Copy-Item dist/windows/Chute-Windows.exe dist/request3-pair/Chutey-Setup-Development1-Request3-TEST.exe
          Copy-Item dist/windows/Chute-NativeHost.exe dist/request3-pair/Chute-NativeHost.exe
          Copy-Item dist/phase1-isolated/Chutey-Phase1-Isolated-Check.exe dist/request3-pair/
          Copy-Item dist/phase1-isolated/BUILD-DEPENDENCIES.txt dist/request3-pair/
          Copy-Item dist/chrome-store/chute-chrome-2.6.1.zip dist/request3-pair/Chutey-Extension-Development1-Request3-TEST.zip
          Copy-Item codex-11.16.2026/REQUEST3-WINDOWS-OWNER-TEST.md dist/request3-pair/START-HERE.md
          Copy-Item codex-11.16.2026/REQUEST3-REPAIR-EVIDENCE.md dist/request3-pair/
          Copy-Item scripts/collect-chutey-resource-diagnostics.ps1 dist/request3-pair/
          Copy-Item latest/documentation/*API*.md dist/request3-pair/
          Copy-Item latest/documentation/local-api.openapi.json dist/request3-pair/
          Copy-Item request3-windows-tests.xml dist/request3-pair/
          Copy-Item -Recurse dist/request3-evidence dist/request3-pair/media-evidence
          git rev-parse HEAD | Out-File dist/request3-pair/SOURCE-COMMIT.txt -Encoding ascii
          python --version | Out-File dist/request3-pair/BUILD-PLATFORM.txt -Encoding ascii
          Get-ComputerInfo -Property OsName,OsVersion,WindowsVersion | Out-File -Append dist/request3-pair/BUILD-PLATFORM.txt
          $base=(Resolve-Path dist/request3-pair).Path
          $lines=@(Get-ChildItem $base -Recurse -File | Sort-Object FullName | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.FullName.Substring($base.Length+1).Replace('\','/'))"
          })
          [IO.File]::WriteAllLines((Join-Path $base 'SHA256SUMS.txt'),[string[]]$lines,[Text.Encoding]::UTF8)
      - uses: actions/upload-artifact@v4
        with:
          name: Chutey-Dev1-Request3-TEST-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/request3-pair/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve test diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Request3-FAILED-test-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            request3-windows-tests.xml
            dist/request3-evidence/

name: Build Windows product binary

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - src/chute/windows_app.py
      - src/chute/native_host.py
      - src/chute/browser_extensions.py
      - tests/test_browser_extensions.py
      - scripts/windows-entry.py
      - scripts/windows-native-host.py
      - scripts/build-windows.ps1
      - .github/workflows/windows-product.yml
  push:
    branches:
      - main
    paths:
      - src/chute/windows_app.py
      - src/chute/native_host.py
      - src/chute/browser_extensions.py
      - tests/test_browser_extensions.py
      - scripts/windows-entry.py
      - scripts/windows-native-host.py
      - scripts/build-windows.ps1
      - .github/workflows/windows-product.yml

permissions:
  contents: write

jobs:
  windows-product:
    runs-on: windows-latest
    steps:
      - name: Check out Chute
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test unpacked-extension ID discovery
        shell: powershell
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests/test_browser_extensions.py tests/test_native_host.py

      - name: Build single-file Windows setup
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1

      - name: Rename as customer setup binary
        shell: powershell
        run: |
          Copy-Item dist\windows\Chute-Windows.exe dist\windows\Chute-Setup.exe -Force

      - name: Smoke-test Store ID, random unpacked ID, native wake, and uninstall registration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "dist\windows\Chute-Setup.exe").Path

          # Simulate a Chrome user who loaded the exact Chute extension unpacked.
          # Chrome may assign essentially any valid 32-letter a-p extension ID.
          $devId = "abcdefghijklmnopabcdefghijklmnop"
          $storeId = "hpcpnigfadojjmnbflfhkfkallfafajb"
          $unpacked = Join-Path $env:RUNNER_TEMP "unpacked-chute\extension"
          New-Item -ItemType Directory -Force -Path $unpacked | Out-Null
          Copy-Item "extension\manifest.json" (Join-Path $unpacked "manifest.json") -Force

          $profile = Join-Path $env:LOCALAPPDATA "Google\Chrome\User Data\Default"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $manifestObject = Get-Content "extension\manifest.json" -Raw | ConvertFrom-Json
          $extensionSettings = @{}
          $extensionSettings[$devId] = @{
            path = $unpacked
            manifest = $manifestObject
          }
          $chromeState = @{
            extensions = @{
              settings = $extensionSettings
            }
          }
          $chromeState | ConvertTo-Json -Depth 20 | Set-Content (Join-Path $profile "Secure Preferences") -Encoding UTF8

          & $setup

          $healthy = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:17891/health" -TimeoutSec 1
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (-not $healthy) { throw "Chute localhost bridge did not become healthy" }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\Chute"
          $installed = Join-Path $installDir "Chute.exe"
          $native = Join-Path $installDir "Chute-NativeHost.exe"
          if (-not (Test-Path $installed)) { throw "Self-installed Chute.exe was not found at $installed" }
          if (-not (Test-Path $native)) { throw "Native host was not found at $native" }

          $data = Join-Path $env:USERPROFILE "Chute"
          if (-not (Test-Path $data)) { throw "Windows Chute data directory was not created at $data" }

          $startup = (Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Chute" -ErrorAction Stop).Chute
          if (-not $startup) { throw "Chute per-user startup registration was not created" }

          $nativeKey = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.thankscohn.chute"
          $nativeManifest = (Get-Item -Path $nativeKey -ErrorAction Stop).GetValue("")
          if (-not $nativeManifest -or -not (Test-Path $nativeManifest)) { throw "Chrome native messaging host registration is missing" }

          $nativeConfig = Get-Content $nativeManifest -Raw | ConvertFrom-Json
          $storeOrigin = "chrome-extension://$storeId/"
          $devOrigin = "chrome-extension://$devId/"
          if ($nativeConfig.allowed_origins -notcontains $storeOrigin) {
            throw "Native host lost the Chrome Web Store extension ID"
          }
          if ($nativeConfig.allowed_origins -notcontains $devOrigin) {
            throw "Native host did not auto-authorize the random unpacked Chute ID"
          }

          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Chute"
          $uninstall = Get-ItemProperty -Path $uninstallKey -ErrorAction Stop
          if ($uninstall.DisplayVersion -ne "2.6.1") { throw "Windows version registration is not 2.6.1" }
          if (-not $uninstall.UninstallString) { throw "Windows uninstall registration is missing" }

          # Prove that the native host alone can recover a dead localhost worker.
          taskkill /IM Chute.exe /F 2>$null | Out-Null
          Start-Sleep -Milliseconds 350
          @'
          import json, struct, subprocess, sys
          host = sys.argv[1]
          payload = json.dumps({"action":"ensure_bridge"}, separators=(",", ":")).encode("utf-8")
          p = subprocess.Popen([host], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          p.stdin.write(struct.pack("=I", len(payload)) + payload)
          p.stdin.flush()
          header = p.stdout.read(4)
          if len(header) != 4:
              raise SystemExit("native host did not reply")
          size = struct.unpack("=I", header)[0]
          response = json.loads(p.stdout.read(size).decode("utf-8"))
          if not response.get("ok"):
              raise SystemExit(f"native wake failed: {response}")
          print(response)
          '@ | python - $native

          $healthy = $false
          for ($i = 0; $i -lt 40; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:17891/health" -TimeoutSec 1
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (-not $healthy) { throw "Native host did not revive Chute localhost bridge" }

          Write-Host "PASS: setup executable self-installed"
          Write-Host "PASS: Store extension origin remains authorized"
          Write-Host "PASS: random unpacked Chute extension origin auto-authorized"
          Write-Host "PASS: native host revived a killed bridge"
          Write-Host "PASS: Windows uninstall entry registered as 2.6.1"

      - name: Create SHA-256 checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash "dist\windows\Chute-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Chute-Setup.exe" | Out-File "dist\windows\Chute-Setup.exe.sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chute-Windows-v2.6.1-rc1
          path: |
            dist/windows/Chute-Setup.exe
            dist/windows/Chute-Setup.exe.sha256

      - name: Publish GitHub prerelease
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "chute-windows-v2.6.1-rc1"
          @"
          # Chute for Windows v2.6.1 RC1

          Test companion for Chute extension 2.6.1.

          This build keeps the fixed Chrome Web Store extension ID authorized and also discovers loaded unpacked copies of the Chute repository, whatever valid extension ID Chrome assigned them. Discovered Chute IDs are persisted into the native messaging host allow-list and refreshed while the companion is running.

          The CI smoke test creates a random unpacked Chute ID, verifies that it is accepted by the installed native host, kills Chute.exe, and verifies that the native host revives the local bridge on 127.0.0.1:17891.

          No Python installation, administrator account, or Windows Service is required.

          This executable is currently unsigned, so Windows SmartScreen may display an Unknown Publisher warning.
          "@ | Out-File release-notes.md -Encoding utf8

          $savedPreference = $ErrorActionPreference
          $ErrorActionPreference = "SilentlyContinue"
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $savedPreference

          if ($releaseExists) {
            gh release upload $tag dist\windows\Chute-Setup.exe dist\windows\Chute-Setup.exe.sha256 --clobber
          } else {
            gh release create $tag dist\windows\Chute-Setup.exe dist\windows\Chute-Setup.exe.sha256 --target $env:GITHUB_SHA --title "Chute for Windows v2.6.1 RC1" --notes-file release-notes.md --prerelease
          }

name: Chutey P0 paired Windows Explorer TEST build
on:
  push:
    branches: [codex/chutey-explorer-windows-usable-asap-2026-11-04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      CHUTE_QUIET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tiny real Windows filesystem and existing regressions
        run: |
          python -m pip install pytest==9.2.0 Pillow==13.0.0
          python -m pytest -q
      - name: Existing worker and Shelf regressions
        run: |
          node scripts/verify-worker-boot.cjs
          node scripts/verify-thumbnail-icons.cjs
          node scripts/verify-chutey-tabs-and-mascot.cjs
          python scripts/verify-upgrades-package.py
      - name: Build existing Windows companion and matching Chrome package
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1
          python scripts/build-chrome-store.py
      - name: Stage a single matched review artifact with checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/pair | Out-Null
          Copy-Item dist/windows/Chute-Windows.exe dist/pair/Chute-Windows-Explorer-TEST.exe
          Copy-Item dist/chrome-store/chute-chrome-2.6.1.zip dist/pair/
          Copy-Item docs/explorer/WINDOWS_P0.md dist/pair/INSTALL-AND-EVIDENCE.md
          git rev-parse HEAD | Out-File dist/pair/SOURCE-COMMIT.txt -Encoding ascii
          Get-ChildItem dist/pair -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File dist/pair/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: Chutey-Windows-Chrome-Explorer-TEST-${{ github.sha }}
          path: dist/pair/

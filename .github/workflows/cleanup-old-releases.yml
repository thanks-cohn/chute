name: Cleanup old Chute releases

on:
  push:
    paths:
      - '.github/workflows/cleanup-old-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all releases except Chute for Windows v2.6.0 RC1
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_TAG: chute-windows-v2.6.0-rc1
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name != env.KEEP_TAG) | .id" |
          while read -r release_id; do
            [ -n "$release_id" ] || continue
            echo "Deleting release id $release_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done

          echo "Remaining releases:"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | "\(.name) [\(.tag_name)]"'
